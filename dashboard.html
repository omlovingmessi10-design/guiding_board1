<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Prayas — Study Desk</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --bg-deep:#141F1A;
    --bg-panel:#1B2822;
    --bg-panel-raised:#22322A;
    --bg-sidebar:#101A16;
    --border:#2C3F35;
    --border-soft:#243529;
    --accent-brass:#C9A227;
    --accent-brass-dim:#8A6F1F;
    --accent-coral:#E1614A;
    --accent-sage:#6FA98A;
    --text-primary:#EDE8DD;
    --text-secondary:#B9C2BA;
    --text-muted:#7C8B81;
    --stamp-bg:#EDE3C8;
    --stamp-ink:#3A2E1F;
    --radius:10px;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  body{
    font-family:'IBM Plex Sans',sans-serif;
    background:var(--bg-deep);
    color:var(--text-primary);
    overflow:hidden;
  }
  .app{
    display:grid;
    grid-template-columns:236px 1fr;
    grid-template-rows:76px 1fr;
    height:100vh;
  }

  /* ---------- SIDEBAR ---------- */
  .sidebar{
    grid-row:1 / span 2;
    background:var(--bg-sidebar);
    border-right:1px solid var(--border);
    display:flex;
    flex-direction:column;
    padding:22px 16px;
  }
  .brand{
    display:flex;
    align-items:baseline;
    gap:8px;
    padding:0 8px 22px 8px;
    border-bottom:1px solid var(--border-soft);
    margin-bottom:18px;
  }
  .brand-mark{
    font-family:'Fraunces',serif;
    font-weight:600;
    font-size:22px;
    letter-spacing:0.3px;
    color:var(--accent-brass);
  }
  .brand-sub{
    font-family:'IBM Plex Mono',monospace;
    font-size:10px;
    color:var(--text-muted);
    letter-spacing:1.5px;
    text-transform:uppercase;
  }
  .nav{
    display:flex;
    flex-direction:column;
    gap:2px;
    flex:1;
    overflow-y:auto;
  }
  .nav-item{
    display:flex;
    align-items:center;
    gap:12px;
    padding:10px 12px;
    border-radius:8px;
    font-size:13.5px;
    color:var(--text-secondary);
    cursor:pointer;
    transition:background .15s ease, color .15s ease;
  }
  .nav-item:hover{background:var(--bg-panel-raised);color:var(--text-primary);}
  .nav-item.active{background:var(--bg-panel-raised);color:var(--text-primary);border-left:2px solid var(--accent-brass);padding-left:10px;}
  .nav-dot{
    width:7px;height:7px;border-radius:50%;
    background:var(--border);
    flex-shrink:0;
  }
  .nav-item.active .nav-dot{background:var(--accent-brass);}
  .sidebar-foot{
    border-top:1px solid var(--border-soft);
    padding-top:14px;
    margin-top:10px;
    font-size:11px;
    color:var(--text-muted);
    font-family:'IBM Plex Mono',monospace;
    line-height:1.6;
  }

  /* ---------- TOP BAR ---------- */
  .topbar{
    grid-column:2;
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:0 28px;
    border-bottom:1px solid var(--border);
    background:var(--bg-panel);
  }
  .quote-strip{
    display:flex;
    align-items:center;
    gap:10px;
    max-width:56%;
  }
  .quote-mark{
    font-family:'Fraunces',serif;
    font-size:26px;
    color:var(--accent-brass-dim);
    line-height:1;
  }
  .quote-text{
    font-family:'Fraunces',serif;
    font-style:italic;
    font-size:14.5px;
    color:var(--text-secondary);
    line-height:1.4;
  }
  .quote-author{
    font-family:'IBM Plex Mono',monospace;
    font-size:10.5px;
    color:var(--text-muted);
    margin-left:6px;
  }
  .profile-block{
    display:flex;
    align-items:center;
    gap:16px;
  }
  .streak-pill{
    display:flex;
    align-items:center;
    gap:6px;
    background:rgba(201,162,39,0.12);
    border:1px solid rgba(201,162,39,0.35);
    color:var(--accent-brass);
    padding:6px 12px;
    border-radius:20px;
    font-family:'IBM Plex Mono',monospace;
    font-size:12px;
    font-weight:500;
  }
  .profile-meta{
    text-align:right;
    line-height:1.35;
  }
  .profile-name{font-size:13.5px;font-weight:500;color:var(--text-primary);}
  .profile-login{font-size:10.5px;color:var(--text-muted);font-family:'IBM Plex Mono',monospace;}
  .avatar{
    width:38px;height:38px;border-radius:50%;
    background:linear-gradient(155deg,#3B5445,#22322A);
    border:1px solid var(--border);
    display:flex;align-items:center;justify-content:center;
    font-family:'Fraunces',serif;font-weight:600;font-size:14px;
    color:var(--accent-brass);
  }

  /* ---------- MAIN ---------- */
  .main{
    grid-column:2;
    overflow-y:auto;
    padding:22px 28px 40px 28px;
  }
  .board{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:22px;
    align-items:start;
  }
  .col{display:flex;flex-direction:column;gap:22px;}

  .panel{
    background:var(--bg-panel);
    border:1px solid var(--border);
    border-radius:var(--radius);
    overflow:hidden;
  }
  .panel-head{
    display:flex;
    align-items:baseline;
    justify-content:space-between;
    padding:14px 18px 12px 18px;
    border-bottom:1px solid var(--border-soft);
  }
  .panel-title{
    font-family:'Fraunces',serif;
    font-weight:600;
    font-size:16.5px;
    letter-spacing:0.2px;
  }
  .panel-count{
    font-family:'IBM Plex Mono',monospace;
    font-size:10.5px;
    color:var(--text-muted);
  }
  .panel-body{padding:14px 18px 18px 18px;}

  /* Today's tasks */
  .subhead{
    display:flex;
    align-items:center;
    gap:8px;
    font-family:'IBM Plex Mono',monospace;
    font-size:10.5px;
    letter-spacing:1.5px;
    color:var(--text-muted);
    text-transform:uppercase;
    margin:14px 0 8px 0;
  }
  .subhead:first-child{margin-top:0;}
  .subhead-tag{
    padding:2px 7px;
    border-radius:4px;
    font-size:9.5px;
  }
  .tag-gs{background:rgba(63,138,221,0.16);color:#7FB4E8;}
  .tag-op{background:rgba(99,153,34,0.18);color:#9ECB63;}
  .tag-ca{background:rgba(214,90,48,0.18);color:#E88C63;}

  .task-row{
    position:relative;
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:9px 10px;
    border-radius:7px;
    margin-bottom:3px;
    cursor:default;
    transition:background .12s ease;
  }
  .task-row:hover{background:var(--bg-panel-raised);}
  .task-left{display:flex;align-items:center;gap:9px;min-width:0;}
  .task-check{
    width:14px;height:14px;border-radius:4px;
    border:1.5px solid var(--border);
    flex-shrink:0;
  }
  .task-name{font-size:13px;color:var(--text-primary);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .task-right{display:flex;align-items:center;gap:10px;flex-shrink:0;}
  .task-due{font-family:'IBM Plex Mono',monospace;font-size:10.5px;color:var(--text-muted);}
  .icon-btn{
    width:22px;height:22px;
    display:flex;align-items:center;justify-content:center;
    border-radius:5px;
    color:var(--text-muted);
    cursor:pointer;
    transition:background .12s ease,color .12s ease;
  }
  .icon-btn:hover{background:var(--bg-deep);color:var(--accent-brass);}
  .icon-btn.danger:hover{color:var(--accent-coral);}

  /* Revision */
  .rev-row{
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:9px 10px;
    border-radius:7px;
    margin-bottom:3px;
    border-left:2px solid transparent;
  }
  .rev-row.overdue{border-left-color:var(--accent-coral);background:rgba(225,97,74,0.06);}
  .rev-left{display:flex;flex-direction:column;gap:2px;min-width:0;}
  .rev-name{font-size:13px;color:var(--text-primary);}
  .rev-source{font-family:'IBM Plex Mono',monospace;font-size:9.5px;color:var(--text-muted);}
  .pending-badge{
    font-family:'IBM Plex Mono',monospace;
    font-size:10px;
    color:var(--accent-coral);
    background:rgba(225,97,74,0.12);
    padding:3px 8px;
    border-radius:5px;
    white-space:nowrap;
    flex-shrink:0;
  }
  .due-badge{
    font-family:'IBM Plex Mono',monospace;
    font-size:10px;
    color:var(--text-muted);
    white-space:nowrap;
    flex-shrink:0;
  }

  /* Classes / CA log rows (shared style) */
  .list-row{
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:10px 10px;
    border-radius:7px;
    margin-bottom:3px;
    transition:background .12s ease;
  }
  .list-row:hover{background:var(--bg-panel-raised);}
  .list-left{display:flex;flex-direction:column;gap:3px;min-width:0;}
  .list-name{font-size:13px;color:var(--text-primary);}
  .list-meta{font-family:'IBM Plex Mono',monospace;font-size:10px;color:var(--text-muted);}
  .list-actions{display:flex;gap:4px;flex-shrink:0;}

  .sync-note{
    display:flex;
    align-items:center;
    gap:6px;
    margin-top:10px;
    padding-top:10px;
    border-top:1px dashed var(--border-soft);
    font-size:10.5px;
    color:var(--text-muted);
    font-family:'IBM Plex Mono',monospace;
  }
  .sync-dot{width:5px;height:5px;border-radius:50%;background:var(--accent-sage);}

  /* Tooltip stamp */
  .stamp-tip{
    position:fixed;
    z-index:50;
    background:var(--stamp-bg);
    color:var(--stamp-ink);
    border:1px solid #B9A66E;
    border-radius:3px;
    padding:8px 12px;
    font-family:'IBM Plex Mono',monospace;
    font-size:11px;
    line-height:1.5;
    box-shadow:0 6px 18px rgba(0,0,0,0.35);
    pointer-events:none;
    opacity:0;
    transform:translateY(4px) rotate(-1.2deg);
    transition:opacity .1s ease, transform .1s ease;
    max-width:220px;
  }
  .stamp-tip.show{opacity:1;transform:translateY(0) rotate(-1.2deg);}
  .stamp-tip .stamp-label{
    text-transform:uppercase;
    letter-spacing:1px;
    font-size:9px;
    color:#7A6A3E;
    display:block;
    margin-bottom:3px;
    border-bottom:1px solid #C9BB8A;
    padding-bottom:3px;
  }
  .stamp-tip .stamp-date{font-weight:500;font-size:13px;}
</style>
</head>
<body>
<div class="app">

  <div class="sidebar">
    <div class="brand">
      <span class="brand-mark">Prayas</span>
      <span class="brand-sub">desk</span>
    </div>
    <div class="nav" id="nav"></div>
    <div class="sidebar-foot">v0.4 &middot; build in progress<br>more panels coming soon</div>
  </div>

  <div class="topbar">
    <div class="quote-strip">
      <span class="quote-mark">&ldquo;</span>
      <span class="quote-text" id="quoteText"></span>
      <span class="quote-author" id="quoteAuthor"></span>
    </div>
    <div class="profile-block">
      <div class="streak-pill" id="streakPill">21 day streak</div>
      <div class="profile-meta">
        <div class="profile-name">Aditi Kumar</div>
        <div class="profile-login" id="loginTime"></div>
      </div>
      <div class="avatar">AK</div>
    </div>
  </div>

  <div class="main">
    <div class="board">

      <!-- LEFT COLUMN -->
      <div class="col">
        <div class="panel">
          <div class="panel-head">
            <span class="panel-title">Revision</span>
            <span class="panel-count">6 due &middot; spaced repetition</span>
          </div>
          <div class="panel-body" id="revisionList"></div>
        </div>

        <div class="panel">
          <div class="panel-head">
            <span class="panel-title">Classes pending</span>
            <span class="panel-count">5 scheduled</span>
          </div>
          <div class="panel-body" id="classesList"></div>
        </div>
      </div>

      <!-- RIGHT COLUMN -->
      <div class="col">
        <div class="panel">
          <div class="panel-head">
            <span class="panel-title">Today's tasks</span>
            <span class="panel-count" id="taskCount"></span>
          </div>
          <div class="panel-body" id="tasksList"></div>
        </div>

        <div class="panel">
          <div class="panel-head">
            <span class="panel-title">Read in CA today</span>
            <span class="panel-count" id="caCount"></span>
          </div>
          <div class="panel-body">
            <div id="caList"></div>
            <div class="sync-note"><span class="sync-dot"></span>Every entry here queues itself into Revision on its spaced-repetition date</div>
          </div>
        </div>
      </div>

    </div>
  </div>
</div>

<div class="stamp-tip" id="stampTip">
  <span class="stamp-label">Next revision</span>
  <span class="stamp-date" id="stampDate">—</span>
</div>

<script>
const ICONS = {
  edit:'<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>',
  trash:'<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18"/><path d="M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/></svg>'
};

function addDays(d,n){const r=new Date(d);r.setDate(r.getDate()+n);return r;}
function fmt(d){return d.toLocaleDateString('en-US',{month:'short',day:'numeric'});}
function fmtFull(d){return d.toLocaleDateString('en-US',{weekday:'short',month:'short',day:'numeric',year:'numeric'});}

const today = new Date();

/* simplified SM-2 style interval ladder */
const SM2_STAGES = [1,3,7,14,30,90];
function nextReview(addedDaysAgo, stage){
  const addedDate = addDays(today, -addedDaysAgo);
  return addDays(addedDate, SM2_STAGES[stage]);
}

/* ---------------- sidebar ---------------- */
const nav = document.getElementById('nav');
for(let i=1;i<=10;i++){
  const el = document.createElement('div');
  el.className = 'nav-item' + (i===1?' active':'');
  el.innerHTML = `<span class="nav-dot"></span><span>Emt ${i}</span>`;
  nav.appendChild(el);
}

/* ---------------- top bar ---------------- */
const QUOTES = [
  ["Discipline is choosing between what you want now and what you want most.","Anon"],
  ["The exam does not test what you know. It tests what you can recall under pressure.","Study notes"],
  ["Small revisions daily beat one large revision monthly.","Study notes"],
  ["Consistency is a syllabus of its own.","Anon"],
  ["You don't rise to the level of your goals, you fall to the level of your systems.","James Clear"],
  ["Read less, revise more.","Toppers' wisdom"],
  ["Every page you revise today is a mark you don't lose tomorrow.","Anon"]
];
const dayIndex = Math.floor(today.getTime()/86400000) % QUOTES.length;
document.getElementById('quoteText').textContent = QUOTES[dayIndex][0];
document.getElementById('quoteAuthor').textContent = '— ' + QUOTES[dayIndex][1];

document.getElementById('loginTime').textContent = 'Last login: Today, 7:42 AM';

/* ---------------- tooltip ---------------- */
const tip = document.getElementById('stampTip');
const tipDate = document.getElementById('stampDate');
function showTip(e,dateObj){
  tipDate.textContent = fmtFull(dateObj);
  tip.classList.add('show');
  moveTip(e);
}
function moveTip(e){
  tip.style.left = (e.clientX + 16) + 'px';
  tip.style.top = (e.clientY + 16) + 'px';
}
function hideTip(){ tip.classList.remove('show'); }

function attachTooltip(el, dateObj){
  el.addEventListener('mouseenter', (e)=>showTip(e,dateObj));
  el.addEventListener('mousemove', moveTip);
  el.addEventListener('mouseleave', hideTip);
}

/* ---------------- today's tasks ---------------- */
const TASK_GROUPS = [
  {key:'gs', label:'General studies', tagClass:'tag-gs', items:[
    {name:'Modern history — ch.5 notes', due:0, addedDaysAgo:5, stage:2},
    {name:'Polity — fundamental rights MCQs', due:1, addedDaysAgo:2, stage:1},
    {name:'Geography — monsoon mechanism', due:2, addedDaysAgo:0, stage:0}
  ]},
  {key:'op', label:'Optional — public administration', tagClass:'tag-op', items:[
    {name:'Classical theory — essay draft', due:0, addedDaysAgo:4, stage:1},
    {name:'Case study — good governance', due:1, addedDaysAgo:1, stage:0},
    {name:'Previous year Qs — unit 3', due:2, addedDaysAgo:6, stage:2}
  ]},
  {key:'ca', label:'Current affairs', tagClass:'tag-ca', items:[
    {name:'Editorial — RBI monetary policy', due:0, addedDaysAgo:0, stage:0},
    {name:'Daily current affairs quiz', due:1, addedDaysAgo:0, stage:0},
    {name:'PIB summary — Aug 15', due:2, addedDaysAgo:1, stage:0}
  ]}
];
const tasksList = document.getElementById('tasksList');
let totalTasks = 0;
TASK_GROUPS.forEach(group=>{
  const h = document.createElement('div');
  h.className = 'subhead';
  h.innerHTML = `<span class="subhead-tag ${group.tagClass}">${group.key.toUpperCase()}</span><span>${group.label}</span>`;
  tasksList.appendChild(h);
  group.items.forEach(item=>{
    totalTasks++;
    const row = document.createElement('div');
    row.className = 'task-row';
    const dueDate = addDays(today, item.due);
    const dueLabel = item.due===0 ? 'Today' : item.due===1 ? 'Tomorrow' : fmt(dueDate);
    row.innerHTML = `
      <div class="task-left">
        <span class="task-check"></span>
        <span class="task-name">${item.name}</span>
      </div>
      <div class="task-right">
        <span class="task-due">${dueLabel}</span>
        <span class="icon-btn" title="Edit task">${ICONS.edit}</span>
      </div>`;
    tasksList.appendChild(row);
    attachTooltip(row, nextReview(item.addedDaysAgo, item.stage));
  });
});
document.getElementById('taskCount').textContent = totalTasks + ' today';

/* ---------------- revision panel ---------------- */
const REVISION = [
  {name:'Modern history — revolt of 1857', source:'from GS log', pendingDays:3},
  {name:'Ecology — biodiversity hotspots', source:'from GS log', pendingDays:3},
  {name:'Chandrayaan mission update', source:'from CA log · Aug 10', pendingDays:3},
  {name:'Polity — DPSP', source:'from GS log', due:0},
  {name:'Geography — ocean currents', source:'from GS log', due:2},
  {name:'Public admin — new public management', source:'from OP log', due:4}
];
const revisionList = document.getElementById('revisionList');
REVISION.forEach(item=>{
  const row = document.createElement('div');
  row.className = 'rev-row' + (item.pendingDays ? ' overdue' : '');
  const right = item.pendingDays
    ? `<span class="pending-badge">Pending ${item.pendingDays} days</span>`
    : `<span class="due-badge">${item.due===0?'Due today':'Due ' + fmt(addDays(today,item.due))}</span>`;
  row.innerHTML = `
    <div class="rev-left">
      <span class="rev-name">${item.name}</span>
      <span class="rev-source">${item.source}</span>
    </div>
    ${right}`;
  revisionList.appendChild(row);
});

/* ---------------- classes pending ---------------- */
const CLASSES = [
  {name:'GS mentorship — mains answer writing', due:'Tomorrow, 5:00 PM'},
  {name:'Optional class — public admin paper 2', due:'Aug 19, 6:30 PM'},
  {name:'CA weekly discussion', due:'Aug 20, 8:00 PM'},
  {name:'Essay writing workshop', due:'Aug 22, 4:00 PM'},
  {name:'Interview guidance session', due:'Aug 24, 11:00 AM'}
];
const classesList = document.getElementById('classesList');
CLASSES.forEach(c=>{
  const row = document.createElement('div');
  row.className = 'list-row';
  row.innerHTML = `
    <div class="list-left">
      <span class="list-name">${c.name}</span>
      <span class="list-meta">${c.due}</span>
    </div>
    <div class="list-actions">
      <span class="icon-btn" title="Edit class">${ICONS.edit}</span>
      <span class="icon-btn danger" title="Delete class">${ICONS.trash}</span>
    </div>`;
  classesList.appendChild(row);
});

/* ---------------- CA read today ---------------- */
const CA_LOG = [
  {name:'The Hindu editorial — India-EU trade', time:'Read 8:10 AM', stage:0},
  {name:'PIB — new education policy update', time:'Read 9:45 AM', stage:0},
  {name:'Down to earth — climate report', time:'Read 11:20 AM', stage:0},
  {name:'Indian Express — economic survey excerpt', time:'Read 1:15 PM', stage:0}
];
const caList = document.getElementById('caList');
CA_LOG.forEach(c=>{
  const row = document.createElement('div');
  row.className = 'list-row';
  row.innerHTML = `
    <div class="list-left">
      <span class="list-name">${c.name}</span>
      <span class="list-meta">${c.time}</span>
    </div>
    <div class="list-actions">
      <span class="icon-btn" title="Edit entry">${ICONS.edit}</span>
      <span class="icon-btn danger" title="Delete entry">${ICONS.trash}</span>
    </div>`;
  caList.appendChild(row);
  attachTooltip(row, nextReview(0, c.stage));
});
document.getElementById('caCount').textContent = CA_LOG.length + ' entries';
</script>
</body>
</html>
